  <details data-name="corpus">
    <summary><a href="/corpus" title="Edit new and existing texts and inspect clictagger region tags">Corpus</a></summary>
    <form>

    <div class="button-group">
      <button data-ctlb-command="load_from_file">Load from file</button>
      <button data-ctlb-command="save_content">Save to file</button>
      <button data-ctlb-command="save_regions">Save regions CSV</button>
    </div>

    <label for="ctlb-corpus-book">...or, load book from CLiC:</label>
    <select id="ctlb-corpus-book" title="book" data-populate="book" data-placeholder="Select a book..." class="tomselect">
    </select>

    <p>To add texts into CLiC, you need to <a href="https://github.com/mahlberg-lab/corpora">open a pull request</a>.</p>

    <h4><span>Highlight subsets</span></h4>
    <div class="highlight-checkboxes">
      <div class="button-group region-spinner">
        <button type="button" title="Previous chapter title" data-cm-command="region-prev" data-cm-command-args='["chapter.title"]'>▲</button>
        <button type="button" title="Next chapter title" data-cm-command="region-next" data-cm-command-args='["chapter.title"]'>▼</button>
      </div>
      <label class="chapter-title">
        <input name="chap-highlight" type="checkbox" value="chapter.title" /><span>Chapter titles</span>
      </label>
      <div class="button-group region-spinner">
        <button type="button" title="Previous sentence" data-cm-command="region-prev" data-cm-command-args='["chapter.sentence"]'>▲</button>
        <button type="button" title="Next sentence" data-cm-command="region-next" data-cm-command-args='["chapter.sentence"]'>▼</button>
      </div>
      <label class="chapter-sentence">
        <input name="chap-highlight" type="checkbox" value="chapter.sentence" /><span>Sentences</span>
      </label>
      <div class="button-group region-spinner">
        <button type="button" title="Previous quote" data-cm-command="region-prev" data-cm-command-args='["quote.quote"]'>▲</button>
        <button type="button" title="Next quote" data-cm-command="region-next" data-cm-command-args='["quote.quote"]'>▼</button>
      </div>
      <label class="quote-quote">
        <input name="chap-highlight" type="checkbox" value="quote.quote" /><span>Quotes</span>
      </label>
      <div class="button-group region-spinner">
        <button type="button" title="Previous short suspension" data-cm-command="region-prev" data-cm-command-args='["quote.suspension.short"]'>▲</button>
        <button type="button" title="Next short suspension" data-cm-command="region-next" data-cm-command-args='["quote.suspension.short"]'>▼</button>
      </div>
      <label class="quote-suspension-short">
        <input name="chap-highlight" type="checkbox" value="quote.suspension.short" /><span>Short suspensions</span>
      </label>
      <div class="button-group region-spinner">
        <button type="button" title="Previous long suspension" data-cm-command="region-prev" data-cm-command-args='["quote.suspension.long"]'>▲</button>
        <button type="button" title="Next long suspension" data-cm-command="region-next" data-cm-command-args='["quote.suspension.long"]'>▼</button>
      </div>
      <label class="quote-suspension-long">
        <input name="chap-highlight" type="checkbox" value="quote.suspension.long" /><span>Long suspensions</span>
      </label>
      <div class="button-group region-spinner">
        <button type="button" title="Previous embedded quote" data-cm-command="region-prev" data-cm-command-args='["quote.embedded"]'>▲</button>
        <button type="button" title="Next embedded quote" data-cm-command="region-next" data-cm-command-args='["quote.embedded"]'>▼</button>
      </div>
      <label class="quote-embedded">
        <input name="chap-highlight" type="checkbox" value="quote.embedded" /><span>Embedded quotes</span>
      </label>
    </div>

    <h4><span>Editing</span></h4>
      <div class="button-group">
        <button data-cm-command="undo">Undo</button>
        <button data-cm-command="redo">Redo</button>
        <button data-cm-command="toggle-search-panel">Find / replace</button>
      </div>

      <label for="ctlb-corpus-insert-char">Add/replace quotation marks around selection:</label>
      <div class="button-group corpus-insert-char">
        <button title="Add/replace quotation marks around selection" data-cm-command="insert-quotation" data-cm-command-args='["“", "”"]' id="ctlb-corpus-insert-char">“”</button>
        <button title="Add/replace quotation marks around selection" data-cm-command="insert-quotation" data-cm-command-args='["‘", "’"]'>‘’</button>
        <button title="Add/replace quotation marks around selection" data-cm-command="insert-quotation" data-cm-command-args='["»", "«"]'>»«</button>
        <button title="Add/replace quotation marks around selection" data-cm-command="insert-quotation" data-cm-command-args='["›", "‹"]'>›‹</button>
        <button title="Add/replace quotation marks around selection" data-cm-command="insert-quotation" data-cm-command-args='["„", "“"]'>„“</button>
        <button title="Add/replace quotation marks around selection" data-cm-command="insert-quotation" data-cm-command-args='["‚", "‘"]'>‚‘</button>
      </div>

      <input type="submit" aria-label="submit" style="display: none;">

    </form>
  </details>
